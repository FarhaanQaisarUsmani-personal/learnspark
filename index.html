<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSpark – Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <div class="login-logo">
        <div class="login-spark">✦</div>
        <div class="login-title">LearnSpark</div>
        <div class="login-sub">Grade 6 Summer Learning Portal</div>
      </div>



      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" id="username" type="text" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div class="error-msg" id="error-msg"></div>
        <button class="btn btn-primary btn-block" type="submit">Sign In</button>
      </form>



    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, redirect away from login page
    (async () => {
      const user = await getSessionUser();
      if (user) {
        window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      }
    })();
  </script>
</body>
</html>
