<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSpark – Content Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><div class="loading-text">Loading content…</div></div>
  <div class="app-wrap">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page-content"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script>
  let currentUser, allSubjects, allWeeks = [];
  let activeTab = 'lessons';

  (async () => {
    currentUser = await requireAuth(['teacher', 'admin']);
    if (!currentUser) return;
    buildSidebar(currentUser, 'teacher');
    buildTopbar('Content Manager');

    allSubjects = await getSubjects();
    for (const s of allSubjects) {
      const weeks = await getWeeksBySubject(s.id);
      allWeeks.push(...weeks.map(w => ({ ...w, subjectSlug: s.slug, subjectName: s.name })));
    }

    renderPage();
    hideLoading();
  })();

  function renderPage() {
    const el = document.getElementById('page-content');
    el.innerHTML = `
      <div class="week-tabs" style="margin-bottom:20px">
        <div class="week-tab ${activeTab==='lessons'?'active':''}" data-tab="lessons">📚 Lessons</div>
        <div class="week-tab ${activeTab==='quizzes'?'active':''}" data-tab="quizzes">🎯 Quizzes</div>
        <div class="week-tab ${activeTab==='resources'?'active':''}" data-tab="resources">📥 Resources</div>
      </div>
      <div id="tab-content"></div>
    `;

    el.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        renderPage();
      });
    });

    const tc = el.querySelector('#tab-content');
    if (activeTab === 'lessons')   renderLessons(tc);
    if (activeTab === 'quizzes')   renderQuizzes(tc);
    if (activeTab === 'resources') renderResources(tc);
  }

  function renderLessons(el) {
    el.innerHTML = `
      <div class="card">
        <div class="sec-hdr">
          <div class="sec-title">All lesson weeks</div>
        </div>
        <p style="font-size:12px;color:var(--tx3);margin-bottom:14px">
          To edit lesson content, update the <strong>weeks</strong> table directly in your
          Supabase dashboard → Table Editor. Objectives live in <strong>learning_objectives</strong>.
        </p>
        <table class="data-table">
          <thead>
            <tr><th>Subject</th><th>Week</th><th>Title</th><th>Overview</th></tr>
          </thead>
          <tbody>
            ${allWeeks.map(w => `
              <tr>
                <td>${subjTag(w.subjectSlug)}</td>
                <td style="font-weight:800">Week ${w.week_number}</td>
                <td style="font-weight:700">${w.title}</td>
                <td style="color:var(--tx3);font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  ${w.overview || '—'}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderQuizzes(el) {
    el.innerHTML = `
      <div class="card">
        <div class="sec-hdr">
          <div class="sec-title">Quiz questions per week</div>
        </div>
        <p style="font-size:12px;color:var(--tx3);margin-bottom:14px">
          Add or edit questions in the <strong>quiz_questions</strong> table and options in
          <strong>quiz_options</strong> in your Supabase dashboard. Mark exactly one option
          per question as <code>is_correct = true</code>.
        </p>
        <table class="data-table">
          <thead>
            <tr><th>Subject</th><th>Week</th><th>Title</th><th>Status</th></tr>
          </thead>
          <tbody>
            ${allWeeks.map(w => `
              <tr>
                <td>${subjTag(w.subjectSlug)}</td>
                <td style="font-weight:800">Week ${w.week_number}</td>
                <td style="font-weight:700">${w.title}</td>
                <td><span class="tag tag-ok">Active</span></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function renderResources(el) {
    el.innerHTML = `<div class="card"><p style="color:var(--tx3);font-size:13px">Loading resources…</p></div>`;

    // Fetch resources for all weeks
    let allResources = [];
    for (const w of allWeeks) {
      const res = await getResources(w.id);
      allResources.push(...res.map(r => ({ ...r, weekTitle: w.title, weekNum: w.week_number, subjectSlug: w.subjectSlug })));
    }

    el.innerHTML = `
      <div class="card">
        <div class="sec-hdr">
          <div class="sec-title">Resource library</div>
        </div>
        <p style="font-size:12px;color:var(--tx3);margin-bottom:14px">
          Upload PDF files to your Supabase Storage bucket named <strong>resources</strong>,
          then add a row to the <strong>resources</strong> table with the storage path.
          Students will get a signed download link automatically.
        </p>
        ${allResources.length ? allResources.map(r => `
          <div class="res-row">
            <div class="res-icon" style="background:var(--${r.subjectSlug==='sci'?'sci':r.subjectSlug==='eng'?'eng':'math'}-bg)">${r.icon || '📄'}</div>
            <div style="flex:1">
              <div class="res-name">${r.name}</div>
              <div class="res-type">
                ${subjTag(r.subjectSlug)} · Week ${r.weekNum} · ${r.file_type || 'PDF'}
                ${r.storage_path ? '' : '<span class="tag tag-warn" style="margin-left:6px">No file</span>'}
              </div>
            </div>
          </div>`).join('')
        : '<p style="font-size:13px;color:var(--tx3)">No resources added yet. Add rows to the resources table in Supabase.</p>'}
      </div>
    `;
  }
  </script>
</body>
</html>
