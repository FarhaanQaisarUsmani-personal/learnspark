<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSpark – Subject</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><div class="loading-text">Loading subject…</div></div>

  <div class="app-wrap">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page-content"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/quiz.js"></script>
  <script>
  let currentUser, subject, weeks, completedIds;
  let activeWeekIdx = 0;
  let mode = 'overview'; // 'overview' | 'lesson' | 'quiz'

  (async () => {
    const slug = getParam('subj');
    if (!slug || !SUBJECT_META[slug]) {
      window.location.href = 'dashboard.html'; return;
    }

    currentUser = await requireAuth(['student']);
    if (!currentUser) return;

    const meta = SUBJECT_META[slug];
    buildSidebar(currentUser, 'subject');
    buildTopbar(meta.name);

    [subject, completedIds] = await Promise.all([
      getSubjectBySlug(slug),
      getCompletedLessons(currentUser.id),
    ]);

    if (!subject) { document.getElementById('page-content').innerHTML = '<p>Subject not found.</p>'; hideLoading(); return; }

    weeks = await getWeeksBySubject(subject.id);
    activeWeekIdx = parseInt(getParam('week') || '0') || 0;

    renderPage();
    hideLoading();
  })();

  function renderPage() {
    const slug = getParam('subj');
    const meta = SUBJECT_META[slug];
    const content = document.getElementById('page-content');

    if (mode === 'quiz') {
      content.innerHTML = `<div id="quiz-container" style="max-width:620px"></div>`;
      initQuiz(weeks[activeWeekIdx].id, currentUser.id, document.getElementById('quiz-container'));
      return;
    }

    if (mode === 'lesson') {
      renderLessonDetail(content, weeks[activeWeekIdx], meta, slug);
      return;
    }

    renderOverview(content, meta, slug);
  }

  async function renderOverview(el, meta, slug) {
    const week = weeks[activeWeekIdx];
    const [objectives, resources, bestScore] = await Promise.all([
      getLearningObjectives(week.id),
      getResources(week.id),
      getBestQuizScore(currentUser.id, week.id),
    ]);

    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <div style="width:42px;height:42px;border-radius:13px;background:var(${meta.bgVar});display:flex;align-items:center;justify-content:center;font-size:22px">${meta.icon}</div>
        <div>
          <div style="font-weight:900;font-size:18px">${meta.name}</div>
          <div style="font-size:12px;color:var(--tx3)">${subject.description || ''}</div>
        </div>
      </div>

      <div class="week-tabs">
        ${weeks.map((w, i) => `
          <div class="week-tab ${i === activeWeekIdx ? 'active' : ''}" data-wi="${i}">
            Week ${w.week_number}: ${w.title}
          </div>`).join('')}
      </div>

      <div class="flex-row">
        <div class="flex-1">
          <div class="card" style="margin-bottom:16px">
            <div style="font-weight:900;font-size:16px;margin-bottom:3px">Week ${week.week_number}: ${week.title}</div>
            <div style="font-size:12px;color:var(--tx3);margin-bottom:14px">📅 Estimated: 2–3 hours · 1 quiz</div>
            <p style="font-size:13px;color:var(--tx2);line-height:1.65;margin-bottom:14px">${week.overview || ''}</p>
            <div style="margin-bottom:16px">
              <div style="font-weight:800;font-size:12px;margin-bottom:7px">🎯 Learning objectives</div>
              ${objectives.map(o => `<div class="obj-item"><div class="obj-dot"></div>${o.objective_text}</div>`).join('')}
            </div>
            <div style="display:flex;gap:9px;flex-wrap:wrap">
              <button class="btn btn-primary" id="btn-lesson">📖 View Lesson</button>
              <button class="btn btn-outline" id="btn-quiz">🎯 Take Quiz</button>
            </div>
          </div>

          <div class="sec-hdr"><div class="sec-title">📥 Downloads</div></div>
          ${resources.map(r => `
            <div class="res-row">
              <div class="res-icon" style="background:var(${meta.bgVar})">${r.icon || '📄'}</div>
              <div style="flex:1">
                <div class="res-name">${r.name}</div>
                <div class="res-type">${r.file_type || 'PDF'}</div>
              </div>
              <button class="btn btn-outline btn-sm dl-btn" data-path="${r.storage_path}" data-name="${r.name}">⬇ Download</button>
            </div>`).join('')}
          ${!resources.length ? '<p style="font-size:13px;color:var(--tx3)">No resources uploaded yet.</p>' : ''}
        </div>

        <div class="flex-col-220">
          <div class="sec-hdr"><div class="sec-title">All Weeks</div></div>
          ${weeks.map((w, i) => {
            const done = completedIds.includes(w.id);
            return `<div style="display:flex;align-items:center;gap:9px;padding:11px 12px;border:1.5px solid ${done ? 'var(--ok)' : 'var(--border)'};border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--surf)" data-wi="${i}">
              <div style="width:26px;height:26px;border-radius:8px;background:var(${meta.bgVar});color:var(${meta.colorVar});display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0">${w.week_number}</div>
              <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${w.title}</div></div>
              ${done ? '<span style="font-size:11px;font-weight:800;color:var(--ok)">✓</span>' : ''}
            </div>`;
          }).join('')}
          ${bestScore != null ? `
            <div class="card card-sm" style="text-align:center;margin-top:8px">
              <div style="font-size:22px;font-weight:900;color:${bestScore >= 80 ? 'var(--ok)' : '#d97706'}">${bestScore}%</div>
              <div style="font-size:11px;color:var(--tx3)">Best quiz score</div>
            </div>` : ''}
        </div>
      </div>
    `;

    el.querySelector('#btn-lesson').addEventListener('click', () => { mode = 'lesson'; renderPage(); });
    el.querySelector('#btn-quiz').addEventListener('click', () => { mode = 'quiz'; renderPage(); });
    el.querySelectorAll('[data-wi]').forEach(btn => {
      btn.addEventListener('click', async () => {
        activeWeekIdx = parseInt(btn.dataset.wi);
        mode = 'overview';
        showLoading('Loading week…');
        await renderOverview(el, meta, slug);
        hideLoading();
      });
    });
    el.querySelectorAll('.dl-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!btn.dataset.path) { toast('No file attached yet.'); return; }
        toast('Getting download link…');
        const url = await getDownloadUrl(btn.dataset.path);
        if (url) window.open(url, '_blank');
        else toast('Could not get download link.');
      });
    });
  }

  async function renderLessonDetail(el, week, meta, slug) {
    const [objectives, resources] = await Promise.all([
      getLearningObjectives(week.id),
      getResources(week.id),
    ]);

    el.innerHTML = `
      <div style="max-width:760px">
        <button class="btn btn-outline btn-sm" id="back-btn" style="margin-bottom:16px">← Back</button>
        <div class="lesson-hdr ${slug}">
          <div class="lesson-hdr-pre">${meta.name} · Week ${week.week_number}</div>
          <div class="lesson-hdr-title">${week.title}</div>
          <div class="lesson-hdr-meta">📚 ${objectives.length} objectives · 📥 ${resources.length} downloads · 🎯 1 quiz</div>
        </div>
        <div class="card" style="margin-bottom:14px">
          <div style="font-weight:800;font-size:14px;margin-bottom:10px">📖 Lesson overview</div>
          <p style="font-size:13px;color:var(--tx2);line-height:1.7">${week.overview || ''}</p>
          ${week.lesson_body ? `<div style="margin-top:14px;font-size:13px;color:var(--tx2);line-height:1.7">${week.lesson_body}</div>` : ''}
        </div>
        <div class="card" style="margin-bottom:14px">
          <div style="font-weight:800;font-size:14px;margin-bottom:10px">🎯 Learning objectives</div>
          ${objectives.map(o => `<div class="obj-item"><div class="obj-dot"></div>${o.objective_text}</div>`).join('')}
        </div>
        <div class="sec-hdr"><div class="sec-title">📥 Downloads</div></div>
        ${resources.map(r => `
          <div class="res-row">
            <div class="res-icon" style="background:var(${meta.bgVar})">${r.icon || '📄'}</div>
            <div style="flex:1"><div class="res-name">${r.name}</div><div class="res-type">${r.file_type || 'PDF'}</div></div>
            <button class="btn btn-outline btn-sm dl-btn" data-path="${r.storage_path}">⬇ Download</button>
          </div>`).join('')}
        <div style="display:flex;gap:9px;margin-top:16px">
          <button class="btn btn-primary" id="lesson-quiz-btn">🎯 Take this week's quiz</button>
          <button class="btn btn-outline" id="back-btn2">← Back</button>
        </div>
      </div>
    `;

    el.querySelector('#back-btn').addEventListener('click', () => { mode = 'overview'; renderPage(); });
    el.querySelector('#back-btn2').addEventListener('click', () => { mode = 'overview'; renderPage(); });
    el.querySelector('#lesson-quiz-btn').addEventListener('click', () => { mode = 'quiz'; renderPage(); });
    el.querySelectorAll('.dl-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!btn.dataset.path) { toast('No file attached yet.'); return; }
        const url = await getDownloadUrl(btn.dataset.path);
        if (url) window.open(url, '_blank');
        else toast('Could not get download link.');
      });
    });
  }
  </script>
</body>
</html>
