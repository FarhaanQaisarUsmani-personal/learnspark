<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSpark – User Role Assignment</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><div class="loading-text">Loading users…</div></div>
  <div class="app-wrap">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page-content"></main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script>
  (async () => {
    const user = await requireAuth(['admin']);
    if (!user) return;
    buildSidebar(user, 'admin');
    buildTopbar('User Role Assignment');

    const profiles = await getAllProfiles();
    const el = document.getElementById('page-content');

    el.innerHTML = `
      <div class="card">
        <div class="sec-hdr">
          <div class="sec-title">Assign user roles</div>
        </div>
        <p style="font-size:12px;color:var(--tx3);margin-bottom:16px">
          Change a user's role using the dropdown. The change saves immediately to the database.
          Be careful — changing your own role to student will lock you out of this page.
        </p>
        <table class="data-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Display name</th>
              <th>Current role</th>
              <th>Assign role</th>
            </tr>
          </thead>
          <tbody>
            ${profiles.map(p => `
              <tr>
                <td>
                  <div class="avatar-row">
                    <div class="avatar">${p.display_name ? p.display_name[0].toUpperCase() : '?'}</div>
                    <strong>${p.username}</strong>
                  </div>
                </td>
                <td style="color:var(--tx2)">${p.display_name}</td>
                <td>
                  <span class="tag ${p.role === 'admin' ? 'tag-math' : p.role === 'teacher' ? 'tag-sci' : 'tag-eng'}">
                    ${p.role}
                  </span>
                </td>
                <td>
                  <select class="form-input form-select role-select"
                    data-uid="${p.id}"
                    data-current="${p.role}"
                    style="width:130px;padding:6px 30px 6px 10px;font-size:12px;font-weight:800">
                    <option value="student" ${p.role === 'student' ? 'selected' : ''}>Student</option>
                    <option value="teacher" ${p.role === 'teacher' ? 'selected' : ''}>Teacher</option>
                    <option value="admin"   ${p.role === 'admin'   ? 'selected' : ''}>Admin</option>
                  </select>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;

    el.querySelectorAll('.role-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const uid = sel.dataset.uid;
        const newRole = sel.value;
        const prev = sel.dataset.current;

        sel.disabled = true;
        const ok = await updateUserRole(uid, newRole);
        sel.disabled = false;

        if (ok) {
          sel.dataset.current = newRole;
          toast(`✅ Role updated to "${newRole}" successfully.`);
          // Update the tag in the same row
          const row = sel.closest('tr');
          const tagCell = row.querySelector('.tag');
          tagCell.className = `tag ${newRole === 'admin' ? 'tag-math' : newRole === 'teacher' ? 'tag-sci' : 'tag-eng'}`;
          tagCell.textContent = newRole;
        } else {
          sel.value = prev;
          toast('❌ Failed to update role. Please try again.');
        }
      });
    });

    hideLoading();
  })();
  </script>
</body>
</html>
