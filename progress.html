<!-- progress.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSpark – My Progress</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><div class="loading-text">Loading progress…</div></div>
  <div class="app-wrap">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page-content"></main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script>
  (async () => {
    const user = await requireAuth(['student']);
    if (!user) return;
    buildSidebar(user, 'progress');
    buildTopbar('My Progress');

    const [progress, quizResults, completedIds] = await Promise.all([
      getProgress(user.id),
      getQuizResults(user.id),
      getCompletedLessons(user.id),
    ]);

    const progMap = {};
    progress.forEach(p => { progMap[p.subjects?.slug] = p.percent_complete || 0; });
    const avg = Math.round(Object.values(progMap).reduce((a, v) => a + v, 0) / 3) || 0;

    const el = document.getElementById('page-content');
    el.innerHTML = `
      <div class="stats-row">
        <div class="stat-card"><div class="stat-icon" style="background:var(--math-bg)">🔢</div><div><div class="stat-val">${progMap.math || 0}%</div><div class="stat-label">Mathematics</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:var(--sci-bg)">🔬</div><div><div class="stat-val">${progMap.sci || 0}%</div><div class="stat-label">Science</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:var(--eng-bg)">📖</div><div><div class="stat-val">${progMap.eng || 0}%</div><div class="stat-label">English</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:var(--acc-bg)">📊</div><div><div class="stat-val">${avg}%</div><div class="stat-label">Overall</div></div></div>
      </div>
      <div class="flex-row">
        <div class="flex-1">
          <div class="card">
            <div class="sec-title" style="margin-bottom:16px">Subject breakdown</div>
            ${['math','sci','eng'].map(slug => {
              const meta = SUBJECT_META[slug];
              const pct = progMap[slug] || 0;
              const dn = completedIds.length;
              return `<div style="margin-bottom:18px">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
                  <span style="font-size:18px">${meta.icon}</span>
                  <div style="flex:1"><div style="font-weight:800;font-size:13px">${meta.name}</div></div>
                  <span style="font-weight:900;color:var(${meta.colorVar})">${pct}%</span>
                </div>
                <div class="prog-bar" style="height:12px"><div class="prog-fill prog-${slug}" style="width:${pct}%"></div></div>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div class="flex-col-220">
          <div class="card">
            <div class="sec-title" style="margin-bottom:14px">Quiz history</div>
            ${quizResults.length ? quizResults.map(r => `
              <div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f0f2ff">
                ${subjTag(r.weeks?.subjects?.slug)}
                <span style="font-size:12px;color:var(--tx2);flex:1">Week ${r.weeks?.week_number}</span>
                <span style="font-weight:900;color:${r.percentage >= 80 ? 'var(--ok)' : '#d97706'}">${r.percentage}%</span>
              </div>`).join('') : '<p style="font-size:13px;color:var(--tx3)">No quizzes taken yet.</p>'}
          </div>
        </div>
      </div>
    `;
    hideLoading();
  })();
  </script>
</body>
</html>
