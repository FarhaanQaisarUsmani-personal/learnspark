<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSpark – Student Progress</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><div class="loading-text">Loading student data…</div></div>
  <div class="app-wrap">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page-content"></main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script>
  (async () => {
    const user = await requireAuth(['teacher', 'admin']);
    if (!user) return;
    buildSidebar(user, 'students-view');
    buildTopbar('Student Progress');

    const students = await getAllStudentProgress();
    const el = document.getElementById('page-content');

    if (!students.length) {
      el.innerHTML = '<div class="card"><p style="color:var(--tx3);font-size:13px">No students found.</p></div>';
      hideLoading(); return;
    }

    el.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="sec-title" style="margin-bottom:14px">Student overview</div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Math</th>
              <th>Science</th>
              <th>English</th>
              <th>Quizzes</th>
            </tr>
          </thead>
          <tbody>
            ${students.map(s => {
              const progMap = {};
              (s.student_progress || []).forEach(p => {
                progMap[p.subjects?.slug] = p.percent_complete || 0;
              });
              return `<tr>
                <td>
                  <div class="avatar-row">
                    <div class="avatar">${s.display_name ? s.display_name[0] : '?'}</div>
                    <div>
                      <div style="font-weight:700;font-size:13px">${s.display_name}</div>
                      <div style="font-size:11px;color:var(--tx3)">Grade ${s.grade || 6}</div>
                    </div>
                  </div>
                </td>
                <td><strong>${progMap.math || 0}%</strong></td>
                <td><strong>${progMap.sci || 0}%</strong></td>
                <td><strong>${progMap.eng || 0}%</strong></td>
                <td>${(s.quiz_results || []).length} taken</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      ${students.map(s => {
        const results = (s.quiz_results || []).sort((a, b) => new Date(b.taken_at) - new Date(a.taken_at));
        if (!results.length) return '';
        return `<div class="card" style="margin-bottom:14px">
          <div class="sec-title" style="margin-bottom:12px">📊 ${s.display_name} — Quiz results</div>
          <table class="data-table">
            <thead><tr><th>Subject</th><th>Week</th><th>Score</th><th>Grade</th><th>Date</th></tr></thead>
            <tbody>
              ${results.map(r => `<tr>
                <td>${subjTag(r.weeks?.subjects?.slug || '')}</td>
                <td>Week ${r.weeks?.week_number || '—'}</td>
                <td><strong>${r.percentage}%</strong></td>
                <td><span class="tag ${r.percentage >= 80 ? 'tag-ok' : 'tag-warn'}">${r.percentage >= 90 ? 'A' : r.percentage >= 80 ? 'B' : r.percentage >= 70 ? 'C' : 'D'}</span></td>
                <td style="color:var(--tx3);font-size:12px">${new Date(r.taken_at).toLocaleDateString()}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      }).join('')}
    `;
    hideLoading();
  })();
  </script>
</body>
</html>
